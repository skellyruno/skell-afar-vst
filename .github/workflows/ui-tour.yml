name: Skell Afar / real JUCE Guided Tour screenshots
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/ui_tour_renderer.cpp'
      - '.github/workflows/ui-tour.yml'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install headless JUCE prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure real editor
        run: cmake -S . -B build-tour -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_AFAR_TOUR_SCREENSHOTS=ON
      - name: Build real editor renderer
        run: cmake --build build-tour --target SkellAfarTourScreenshots --parallel 2
      - name: Verify tutorial at three real window sizes
        run: |
          set -euo pipefail
          runner=$(find build-tour -type f -name SkellAfarTourScreenshots -executable | head -n 1)
          test -n "$runner"
          xvfb-run -a -s '-screen 0 1920x1200x24' "$runner" --output ui-tour-screenshots
          test "$(find ui-tour-screenshots -name '*.png' | wc -l)" -eq 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkellAfar-Real-JUCE-Guided-Tour
          path: ui-tour-screenshots/
          if-no-files-found: warn
          retention-days: 14
