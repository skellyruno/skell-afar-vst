name: Skell Afar v0.6.0 reproduce source artwork
on:
  push:
    branches: [update/skell-afar-v0.6.0-integrated]
permissions:
  contents: write
concurrency:
  group: afar-v060-artwork-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-art:
    if: github.ref == 'refs/heads/update/skell-afar-v0.6.0-integrated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reproduce exact v0.6.0 scene assets
        run: |
          python -m pip install pillow==12.3.0 numpy==2.3.5
          python tools/generate_assets.py
      - name: Commit generated source images only on the draft update branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/bg_panel.png Assets/logo_skull.png Assets/space_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(afar): regenerate exact v0.6.0 art'
            git push origin HEAD:refs/heads/update/skell-afar-v0.6.0-integrated
          fi
