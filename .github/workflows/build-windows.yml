name: Skell-Afar Windows VST3
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Generate byte-identical v0.6.0 scene artwork
        run: |
          python -m pip install pillow==12.3.0 numpy==2.3.5
          python tools/generate_assets.py
      - name: Configure (JUCE 8.0.12, pinned SkellCore)
        run: cmake -S . -B build -A x64
      - name: Compile Release VST3
        run: cmake --build build --config Release --parallel 2
      - name: Run physics and DSP regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Regression-test VST3 bundle validator
        run: python -m unittest discover -s tools -p test_verify_vst3_package.py -v
      - name: Stage and validate Windows VST3 preview
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path build -Recurse -Directory -Filter 'Skell-Afar.vst3')
          if ($plugins.Count -ne 1) { throw "Expected exactly one Skell-Afar.vst3 bundle, found $($plugins.Count)" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $plugins[0].FullName -Destination 'dist/Skell-Afar.vst3' -Recurse
          python tools/verify_vst3_package.py dist/Skell-Afar.vst3 --fix-json --manifest dist/vst3-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'VST3 verification failed' }
          $buildInfo = [ordered]@{
            product = 'Skell Afar'
            version = '0.6.0'
            format = 'VST3'
            platform = 'Windows x86_64'
            release_status = 'preview-only; not a commercial release'
            source_commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $buildInfo | ConvertTo-Json -Depth 4 | Set-Content -Path 'dist/build-info.json' -Encoding utf8
          @(
            'Skell Afar Windows VST3 preview package.'
            'release_status: preview-only; not a commercial release.'
            'Not a signed installer.'
            'Back up existing plugin installations before manual testing.'
          ) | Set-Content -Path 'dist/PREVIEW-ONLY.txt' -Encoding ascii
          Copy-Item -LiteralPath RELEASE-NOTES.txt -Destination dist/RELEASE-NOTES.txt
          $distRoot = (Resolve-Path dist).Path
          $files = Get-ChildItem -Path dist -Recurse -File | Sort-Object FullName
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = $file.FullName.Substring($distRoot.Length + 1).Replace([string][char]92,'/')
            "$hash  $relative"
          }
          $checksums | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Add checksum-verified private-preview installer and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath scripts/Install-Skell-Afar.ps1 -Destination dist/Install-Skell-Afar.ps1
          Copy-Item -LiteralPath INSTALL-WINDOWS.txt -Destination dist/INSTALL-WINDOWS.txt
          Copy-Item -LiteralPath THIRD-PARTY-NOTICES.txt -Destination dist/THIRD-PARTY-NOTICES.txt
          $toolFiles = @('Install-Skell-Afar.ps1','INSTALL-WINDOWS.txt','THIRD-PARTY-NOTICES.txt')
          $toolSums = foreach ($relative in $toolFiles) {
            $path = Join-Path dist $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing preview tool: $relative" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $toolSums | Set-Content -LiteralPath dist/TOOLS-SHA256SUMS.txt -Encoding ascii
      - name: Test private-preview install, update and rollback
        shell: pwsh
        run: ./scripts/Test-Install-Skell-Afar.ps1 -PackageRoot dist -TestRoot "$env:RUNNER_TEMP/Skell-Afar-Install-Test"
      - name: Validate Skell Afar VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: dist/Skell-Afar.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - uses: actions/upload-artifact@v6
        with:
          name: Skell-Afar-Windows-VST3-Preview
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
