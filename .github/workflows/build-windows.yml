name: Skell-Afar Windows VST3 / Standalone
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate byte-identical v0.6.0 scene artwork
        run: |
          python -m pip install pillow==12.3.0 numpy==2.3.5
          python tools/generate_assets.py
      - name: Configure (JUCE 8.0.12, pinned SkellCore)
        run: cmake -S . -B build -A x64
      - name: Compile Release
        run: cmake --build build --config Release --parallel 2
      - name: Run physics tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Regression-test VST3 bundle validator
        run: python -m unittest discover -s tools -p test_verify_vst3_package.py -v
      - name: Package VST3 and standalone
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter 'Skell-Afar.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'Skell-Afar.vst3 not found' }
          $app = Get-ChildItem -Path build -Recurse -File -Filter 'Skell-Afar.exe' | Select-Object -First 1
          if (-not $app) { throw 'Standalone Skell-Afar.exe not found' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $plugin.FullName -Destination 'dist/Skell-Afar.vst3' -Recurse
          Copy-Item $app.FullName -Destination 'dist/Skell-Afar.exe'
          # JUCE 8.0.12 may generate moduleinfo.json with trailing commas.
          # Correct only metadata and fail on identity or x64 binary mismatch.
          python tools/verify_vst3_package.py dist/Skell-Afar.vst3 --fix-json --manifest dist/vst3-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'VST3 verification failed' }
          Compress-Archive -Path dist/* -DestinationPath 'Skell-Afar-Windows.zip' -Force
      - uses: actions/upload-artifact@v6
        with:
          name: Skell-Afar-Windows-VST3-Standalone
          path: Skell-Afar-Windows.zip
          if-no-files-found: error
