name: Skell-Afar Windows VST3 / Standalone
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate byte-identical v0.5.4 scene artwork
        run: |
          python -m pip install pillow==12.3.0
          python tools/generate_assets.py
      - name: Configure (JUCE 8.0.12, pinned SkellCore)
        run: cmake -S . -B build -A x64
      - name: Compile Release
        run: cmake --build build --config Release --parallel 2
      - name: Run physics tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and standalone
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter 'Skell-Afar.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'Skell-Afar.vst3 not found' }
          $app = Get-ChildItem -Path build -Recurse -File -Filter 'Skell-Afar.exe' | Select-Object -First 1
          if (-not $app) { throw 'Standalone Skell-Afar.exe not found' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $plugin.FullName -Destination 'dist/Skell-Afar.vst3' -Recurse
          Copy-Item $app.FullName -Destination 'dist/Skell-Afar.exe'
          Compress-Archive -Path dist/* -DestinationPath 'Skell-Afar-Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skell-Afar-Windows-VST3-Standalone
          path: Skell-Afar-Windows.zip
          if-no-files-found: error
