name: Skell-Afar macOS VST3 / Standalone
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate byte-identical v0.5.4 scene artwork
        run: |
          python -m pip install pillow==12.3.0
          python tools/generate_assets.py
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test physics
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package plugin and app
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find build -name 'Skell-Afar.vst3' -type d | head -n 1)"
          app="$(find build -name 'Skell-Afar.app' -type d | head -n 1)"
          test -n "$plugin" && test -n "$app"
          mkdir -p dist
          cp -R "$plugin" "$app" dist/
          ditto -c -k --sequesterRsrc --keepParent dist Skell-Afar-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skell-Afar-macOS
          path: Skell-Afar-macOS.zip
          if-no-files-found: error
