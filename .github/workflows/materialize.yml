name: Materialize Skell-Afar Source and Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.b85'
      - 'bootstrap/unpack.py'
      - '.github/workflows/materialize.yml'
permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install artwork build dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Expand verified v0.2 source snapshot
        run: python bootstrap/unpack.py
      - name: Regenerate and stage original procedural scene art
        run: python tools/generate_assets.py
      - name: Check source and asset integrity
        run: python tests/test_project_integrity.py
      - name: Headless scene and texture tests
        run: |
          cmake -S . -B build-headless -DSKELL_AFAR_HEADLESS_ONLY=ON
          cmake --build build-headless --parallel 2
          ctest --test-dir build-headless --output-on-failure
      - name: Commit expanded source and artwork to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md .gitignore Source tests tools Assets .github/workflows/build-windows.yml .github/workflows/build-macos.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat(afar): publish JUCE Skell-Afar v0.2 with single Throat Texture macro'
            git push origin HEAD:main
          fi

  windows-vst3:
    needs: [materialize]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure JUCE 8 and pinned SkellCore
        run: cmake -S . -B build -A x64
      - name: Compile release VST3 and Standalone
        run: cmake --build build --config Release --parallel 2
      - name: Execute headless tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows builds
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'Skell-Afar VST3 bundle missing' }
          $app = Get-ChildItem build -Recurse -File -Filter 'Skell-Afar.exe' | Select-Object -First 1
          if (-not $app) { throw 'Skell-Afar standalone executable missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $plugin.FullName -Destination 'dist/Skell-Afar.vst3' -Recurse
          Copy-Item $app.FullName -Destination 'dist/Skell-Afar.exe'
          Compress-Archive -Path dist/* -DestinationPath 'Skell-Afar-Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Skell-Afar-v0.2-Windows-VST3-Standalone
          path: Skell-Afar-Windows.zip
          if-no-files-found: error
